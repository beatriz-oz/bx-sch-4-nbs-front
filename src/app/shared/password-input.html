<div class="relative">
  <input [id]="inputId()" [type]="visible() ? 'text' : 'password'" [attr.autocomplete]="autocomplete()"
    [value]="value()" [disabled]="disabled()" (input)="typed($any($event.target).value)" (blur)="blurred()"
    autocapitalize="off" spellcheck="false"
    class="w-full rounded-lg border border-gray-300 py-2.5 pr-11 pl-3 focus:border-gray-900 focus:outline-none disabled:bg-gray-50" />
  <button type="button" (click)="toggle()" [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? hideLabel : showLabel" [title]="visible() ? hideLabel : showLabel"
    class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-lg text-gray-500 hover:text-gray-900">
    @if (visible()) {
      <!-- Eye with a slash: hide it again -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M3 3l18 18" />
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
        <path d="M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.2 6.2C3.9 7.7 2.5 10 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 5-1.4" />
      </svg>
    } @else {
      <!-- Eye: show what she typed -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
