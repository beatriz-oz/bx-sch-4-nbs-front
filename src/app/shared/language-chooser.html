@if (visible()) {
  <!-- On purpose not translated: the visitor has not chosen a language yet, so it speaks both. -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4 backdrop-blur-sm" (click)="keepCurrent()">
    <section role="dialog" aria-modal="true" aria-labelledby="language-title"
      class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl" (click)="$event.stopPropagation()">
      <img src="images/logo-mark.png" alt="" width="56" height="56" class="mx-auto h-14 w-14" />
      <h2 id="language-title" class="mt-3 text-lg font-semibold text-primary">
        <span lang="pt-PT">Escolha a língua</span> · <span lang="en">Choose your language</span>
      </h2>
      <div class="mt-5 grid gap-3">
        <button #first type="button" lang="pt-PT" (click)="choose('pt-PT')"
          class="flex items-center justify-center gap-3 rounded-full bg-primary px-5 py-3 font-medium text-white hover:bg-primary-hover">
          <img src="flags/pt.svg" alt="" width="24" height="18" class="h-[18px] w-6 rounded-sm" />
          Português
        </button>
        <button type="button" lang="en" (click)="choose('en')"
          class="flex items-center justify-center gap-3 rounded-full border border-gray-300 px-5 py-3 font-medium hover:bg-gray-100">
          <img src="flags/gb.svg" alt="" width="24" height="18" class="h-[18px] w-6 rounded-sm ring-1 ring-black/10" />
          English
        </button>
      </div>
      <p class="mt-4 text-xs text-gray-500">
        <span lang="pt-PT">Pode mudar a qualquer momento em cima, em PT | EN.</span><br />
        <span lang="en">You can switch any time at the top, in PT | EN.</span>
      </p>
    </section>
  </div>
}
