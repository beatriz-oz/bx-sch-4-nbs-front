<div class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
    <div class="flex h-[4.5rem] items-center justify-between px-4">
      <a routerLink="/">
        <h1 class="text-xl font-semibold text-brand-700">Nails by Scooby</h1>
        <p i18n="@@header.tagline" class="text-sm text-gray-500">Nail design studio in Porto</p>
      </a>

      @if (auth.user(); as user) {
        <div class="flex items-center gap-3 text-sm">
          <span class="hidden text-gray-600 sm:inline">{{ user.name }} {{ user.last_name }}</span>
          <button
            type="button"
            (click)="logout()"
            i18n="@@header.logout"
            class="rounded-full border border-gray-300 px-4 py-1.5 font-medium text-gray-700 hover:bg-gray-100"
          >
            Log out
          </button>
        </div>
      }
    </div>
  </header>

  <!-- Each page sets its own width: the calendar uses the whole screen. -->
  <main>
    <router-outlet />
  </main>
</div>
