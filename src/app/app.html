<div class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-20 overflow-hidden border-b border-gray-200 bg-white">
    <!-- The studio's texture behind everything, at 65% (not on the textured pages: there the header stays white). Decorative only, so screen readers and clicks skip it.
         A relative url (no leading "/") follows the <base href>, so it works under /pt-PT/ and /en/ too. -->
    @if (!texturedPage()) {
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-cover bg-center opacity-65"
        style="background-image: url('images/login-background.jpg')"></div>
    }

    <div class="relative flex h-[4.5rem] items-center justify-between px-4">
      <!-- The nail icon and the name go home. The icon is decorative (alt=""): the name says it all. -->
      <a routerLink="/" class="flex items-center gap-2">
        <img src="images/logo-mark.png" alt="" width="40" height="40" class="h-10 w-10 shrink-0" />
        <div>
          <h1 class="text-xl font-semibold text-primary">Nails by Scooby</h1>
          <p class="text-sm text-gray-600">
            <ng-container i18n="@@header.tagline">Nail Artist in Porto</ng-container> |
            <!-- A drawn flag: the emoji shows as "PT" on Windows -->
            <img src="flags/pt.svg" alt="" width="20" height="15" class="inline h-[15px] w-5 rounded-[2px] align-[-2px] ring-1 ring-black/10" />
          </p>
        </div>
      </a>

      <div class="flex items-center gap-3 text-sm">
        <!-- The studio's Instagram, in a new tab -->
        <a href="https://instagram.com/nailsbyscooby" target="_blank" rel="noopener noreferrer"
          title="@nailsbyscooby on Instagram" i18n-title="@@header.instagram"
          class="rounded-full p-1.5 text-primary hover:bg-white/70">
          <!-- The Instagram camera: rounded square, lens and flash -->
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none" />
          </svg>
          <span i18n="@@header.newTab" class="sr-only">(opens Instagram in a new tab)</span>
        </a>

        <nav aria-label="Language" i18n-aria-label="@@header.language" class="flex items-center font-medium">
          <a [href]="languageHref('pt-PT')" (click)="rememberLanguage('pt-PT')" hreflang="pt-PT" lang="pt-PT" [attr.aria-current]="isPortuguese ? 'true' : null"
            class="rounded px-1.5 py-1 text-gray-500 hover:text-gray-900 aria-[current=true]:text-gray-900">PT</a>
          <span aria-hidden="true" class="text-gray-400">|</span>
          <a [href]="languageHref('en')" (click)="rememberLanguage('en')" hreflang="en" lang="en" [attr.aria-current]="isPortuguese ? null : 'true'"
            class="rounded px-1.5 py-1 text-gray-500 hover:text-gray-900 aria-[current=true]:text-gray-900">EN</a>
        </nav>

      @if (auth.user(); as user) {
        <div class="flex items-center gap-3">
          <span class="hidden text-gray-700 sm:inline">{{ user.name }} {{ user.last_name }}</span>
          <button
            type="button"
            (click)="logout()"
            i18n="@@header.logout"
            class="rounded-full border border-gray-300 bg-white/80 px-4 py-1.5 font-medium text-gray-700 hover:bg-white"
          >
            Log out
          </button>
        </div>
      }
      </div>
    </div>
  </header>

  <!-- The client's menu (the manicure has her own side menu in the admin) -->
  @if (auth.user() && !auth.isAdmin()) {
      <nav class="border-b border-gray-200 bg-white">
        <ul class="mx-auto flex max-w-xl justify-around text-sm">
          <li>
            <a routerLink="/book" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.book"
              class="block border-b-2 border-transparent px-3 py-3 font-medium text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Book</a>
          </li>
          <li>
            <a routerLink="/appointments" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.appointments"
              class="block border-b-2 border-transparent px-3 py-3 font-medium text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">My appointments</a>
          </li>
          <li>
            <a routerLink="/prices" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.prices"
              class="block border-b-2 border-transparent px-3 py-3 font-medium text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Prices</a>
          </li>
          <li>
            <a routerLink="/profile" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.profile"
              class="block border-b-2 border-transparent px-3 py-3 font-medium text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Profile</a>
          </li>
        </ul>
      </nav>
  }

  <!-- Each page sets its own width: the calendar uses the whole screen.
       Textured pages get the studio's texture as background (relative url: follows the <base href>).
       bg-fixed keeps the picture the size of the screen, even on a long page.
       flow-root keeps a page's top margin (mt-8) inside <main>, so the texture starts right under the header. -->
  <main [class]="texturedPage() ? 'flow-root min-h-[calc(100vh-4.5rem)] bg-cover bg-fixed bg-center' : ''"
    [style.background-image]="texturedPage() ? 'url(images/login-background.jpg)' : null">
    <router-outlet />
  </main>

  <!-- First visit: Português or English (remembered, never asked again) -->
  <app-language-chooser />

  <!-- The nail icon comes from Vecteezy's free license, which asks for this credit with a link. -->
  <footer class="py-3 text-center text-xs text-gray-400">
    <ng-container i18n="@@footer.iconCredit">Nail icon:</ng-container>
    <a href="https://www.vecteezy.com" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-600">Vecteezy.com</a>
  </footer>
</div>
