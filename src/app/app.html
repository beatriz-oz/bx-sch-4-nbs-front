<div class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-20 overflow-hidden border-b border-gray-200 bg-white">
    <!-- The studio's texture behind everything, at 65% (not on the textured pages, there the header stays white, unless they ask for it with data.headerTexture). Decorative only, so screen readers and clicks skip it.
         A relative url (no leading "/") follows the <base href>, so it works under /pt-PT/ and /en/ too. -->
    @if (headerTexture()) {
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-cover bg-center opacity-65"
        style="background-image: url('images/login-background.jpg')"></div>
    }

    <div class="relative flex h-[4.5rem] items-center justify-between gap-2 px-3 sm:px-4">
      <!-- The nail icon and the name go home. The icon is decorative (alt=""): the name says it all.
           On a phone everything is a bit smaller, and the name never breaks into two lines. -->
      <a routerLink="/" class="flex min-w-0 items-center gap-1.5 sm:gap-2">
        <img src="images/logo-mark.png" alt="" width="40" height="40" class="h-7 w-7 shrink-0 min-[380px]:h-8 min-[380px]:w-8 sm:h-10 sm:w-10" />
        <div class="min-w-0">
          <h1 class="text-base font-semibold whitespace-nowrap text-primary min-[380px]:text-lg sm:text-xl">Nails by Scooby</h1>
          <p class="text-[11px] whitespace-nowrap text-gray-600 min-[380px]:text-xs sm:text-sm">
            <ng-container i18n="@@header.tagline">Nail Artist in Porto</ng-container>
          </p>
        </div>
      </a>

      <div class="flex shrink-0 items-center gap-1 text-sm sm:gap-3">
        <!-- The studio's Instagram, in a new tab -->
        <a href="https://instagram.com/nailsbyscooby" target="_blank" rel="noopener noreferrer"
          title="@nailsbyscooby on Instagram" i18n-title="@@header.instagram"
          class="rounded-full p-1 text-primary hover:bg-white/70 sm:p-1.5">
          <!-- The Instagram camera: rounded square, lens and flash -->
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none" />
          </svg>
          <span i18n="@@header.newTab" class="sr-only">(opens Instagram in a new tab)</span>
        </a>

        <nav aria-label="Language" i18n-aria-label="@@header.language" class="flex items-center font-medium">
          <a [href]="languageHref('pt-PT')" (click)="rememberLanguage('pt-PT')" hreflang="pt-PT" lang="pt-PT" [attr.aria-current]="isPortuguese ? 'true' : null"
            class="rounded px-1.5 py-1 text-gray-500 hover:text-gray-900 aria-[current=true]:text-gray-900">PT</a>
          <span aria-hidden="true" class="text-gray-400">|</span>
          <a [href]="languageHref('en')" (click)="rememberLanguage('en')" hreflang="en" lang="en" [attr.aria-current]="isPortuguese ? null : 'true'"
            class="rounded px-1.5 py-1 text-gray-500 hover:text-gray-900 aria-[current=true]:text-gray-900">EN</a>
        </nav>

      @if (auth.user(); as user) {
        <div class="flex items-center gap-3">
          <span class="hidden text-gray-700 md:inline">{{ user.name }} {{ user.last_name }}</span>
          <!-- On a phone only the icon (the text stays for screen readers); from sm on, the word too. -->
          <button
            type="button"
            (click)="logout()"
            title="Log out"
            i18n-title="@@header.logout"
            class="flex items-center gap-1.5 rounded-full border border-gray-300 bg-white/80 p-2 font-medium whitespace-nowrap text-gray-700 hover:bg-white sm:px-4 sm:py-1.5"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 sm:hidden" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
              <path d="M10 17l-5-5 5-5" />
              <path d="M5 12h11" />
            </svg>
            <span i18n="@@header.logout" class="sr-only sm:not-sr-only">Log out</span>
          </button>
        </div>
      }
      </div>
    </div>
  </header>

  <!-- The client's menu (the manicure has her own side menu in the admin) -->
  @if (auth.user() && !auth.isAdmin()) {
      <nav class="border-b border-gray-200 bg-white">
        <ul class="mx-auto flex max-w-xl justify-around overflow-x-auto text-[13px] sm:text-sm">
          <li>
            <a routerLink="/book" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.book"
              class="block border-b-2 border-transparent px-2 py-3 font-medium whitespace-nowrap sm:px-3 text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Book</a>
          </li>
          <li>
            <a routerLink="/appointments" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.appointments"
              class="block border-b-2 border-transparent px-2 py-3 font-medium whitespace-nowrap sm:px-3 text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">My appointments</a>
          </li>
          <li>
            <a routerLink="/prices" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.prices"
              class="block border-b-2 border-transparent px-2 py-3 font-medium whitespace-nowrap sm:px-3 text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Prices</a>
          </li>
          <li>
            <a routerLink="/policies" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.policies"
              class="block border-b-2 border-transparent px-2 py-3 font-medium whitespace-nowrap sm:px-3 text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Policies</a>
          </li>
          <li>
            <a routerLink="/profile" routerLinkActive ariaCurrentWhenActive="page" i18n="@@clientNav.profile"
              class="block border-b-2 border-transparent px-2 py-3 font-medium whitespace-nowrap sm:px-3 text-gray-500 hover:text-gray-900 aria-[current=page]:border-gray-900 aria-[current=page]:text-gray-900">Profile</a>
          </li>
        </ul>
      </nav>
  }

  <!-- Each page sets its own width: the calendar uses the whole screen.
       Textured pages get the studio's texture as background (relative url: follows the <base href>).
       bg-fixed keeps the picture the size of the screen, even on a long page.
       flow-root keeps a page's top margin (mt-8) inside <main>, so the texture starts right under the header. -->
  <main [class]="texturedPage() ? 'flow-root min-h-[calc(100vh-4.5rem)] bg-cover bg-fixed bg-center' : ''"
    [style.background-image]="texturedPage() ? 'url(images/login-background.jpg)' : null">
    <router-outlet />
  </main>

  <!-- First visit: Português or English (remembered, never asked again) -->
  <app-language-chooser />

</div>
