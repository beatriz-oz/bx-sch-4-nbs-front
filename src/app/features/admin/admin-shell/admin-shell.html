<div class="flex min-h-[calc(100vh-4.5rem)] flex-col md:flex-row">
  <!-- Phones: a bar with the hamburger on the left; the menu opens as a drawer from the left. -->
  <div class="flex items-center gap-2 border-b border-gray-200 bg-white px-3 py-2 md:hidden">
    <button type="button" (click)="menuOpen.set(true)" [attr.aria-expanded]="menuOpen()" aria-controls="admin-menu"
      aria-label="Open the menu" i18n-aria-label="@@nav.open"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-100">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <span class="font-medium text-gray-800">{{ currentTitle() }}</span>
  </div>
  @if (menuOpen()) {
    <div class="fixed inset-0 z-40 bg-black/30 md:hidden" (click)="menuOpen.set(false)" aria-hidden="true"></div>
  }

  <!-- From md on: the side menu, always open. -->
  <nav id="admin-menu" aria-label="Admin menu" i18n-aria-label="@@nav.label"
    class="border-gray-200 bg-white md:static md:z-auto md:block md:w-56 md:shrink-0 md:overflow-visible md:border-r md:shadow-none"
    [class]="menuOpen() ? 'fixed inset-y-0 left-0 z-50 block w-72 overflow-y-auto shadow-xl' : 'hidden'">
    <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3 md:hidden">
      <span i18n="@@nav.title" class="font-semibold">Menu</span>
      <button type="button" (click)="menuOpen.set(false)" aria-label="Close the menu" i18n-aria-label="@@nav.close"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-xl leading-none text-gray-600 hover:bg-gray-100">×</button>
    </div>
    <ul class="flex flex-col gap-1 p-3 text-sm">
      <li>
        <a
          routerLink="/admin"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">📅</span>
          <span i18n="@@nav.calendar">Calendar</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/payments"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">💳</span>
          <span i18n="@@nav.payments">Payments</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/reports"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">📊</span>
          <span i18n="@@nav.reports">Reports</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/expenses"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">🧾</span>
          <span i18n="@@nav.expenses">Expenses</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/clients"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">👥</span>
          <span i18n="@@nav.clients">Clients</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/opening-hours"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">🕒</span>
          <span i18n="@@nav.openingHours">Opening hours</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/pre-approved"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">✅</span>
          <span i18n="@@nav.preApproved">Pre-approved Instagram</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/prices"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">💶</span>
          <span i18n="@@nav.prices">Prices</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/admin/policies"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">📄</span>
          <span i18n="@@nav.policies">Policies</span>
        </a>
      </li>
      <li class="mt-2 border-t border-gray-200 pt-2">
        <a
          routerLink="/admin/account"
          routerLinkActive ariaCurrentWhenActive="page"
          class="flex items-center gap-2 rounded-lg px-3 py-2 whitespace-nowrap text-gray-700 hover:bg-gray-100 aria-[current=page]:bg-gray-900 aria-[current=page]:text-white aria-[current=page]:hover:bg-gray-800"
        >
          <span aria-hidden="true">🔑</span>
          <span i18n="@@nav.account">My account</span>
        </a>
      </li>
    </ul>
  </nav>

  <section class="min-w-0 flex-1 bg-white">
    <router-outlet />
  </section>
</div>
