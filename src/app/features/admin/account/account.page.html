@if (auth.user(); as user) {
  <div class="max-w-xl p-4 md:p-6">
    <h2 i18n="@@account.title" class="text-2xl font-semibold">My account</h2>

    <section class="mt-6 rounded-2xl border border-gray-200 bg-white">
      <p class="border-b border-gray-100 px-5 py-4 text-lg font-semibold">{{ user.name }} {{ user.last_name }}</p>
      <dl class="divide-y divide-gray-100 text-sm">
        <div class="flex justify-between gap-3 px-5 py-3">
          <dt i18n="@@booking.client.email" class="text-gray-500">Email</dt>
          <dd class="text-right break-all">{{ user.email }}</dd>
        </div>
        <div class="flex justify-between gap-3 px-5 py-3">
          <dt i18n="@@login.phone" class="text-gray-500">Phone</dt>
          <dd>{{ user.phone }}</dd>
        </div>
      </dl>
      <p i18n="@@account.loginHint" class="border-t border-gray-100 px-5 py-3 text-xs text-gray-500">
        You log in with this phone. The code to reset your password goes to this email.
      </p>
    </section>

    <section class="mt-6 rounded-2xl border border-gray-200 bg-white p-5">
      <h3 i18n="@@password.title" class="mb-4 font-semibold">Change password</h3>
      <app-change-password-form />
    </section>
  </div>
}
